server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects on this host/port (shop :8090 and public 443).
    absolute_redirect off;
    port_in_redirect off;

    # Tommy's builder (PC-config) on the same shop box, port 8091.
    location /builder/ {
        proxy_pass http://host.docker.internal:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Public quote API only. Do not proxy the rest of :8091 /api/.
    location ~ ^/api/(quotes|catalog|estimates|volume)(/|$) {
        proxy_pass http://host.docker.internal:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
